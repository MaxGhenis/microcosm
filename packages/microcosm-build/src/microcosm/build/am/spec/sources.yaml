stage_manifest:
  version: 1
  country: am
  policy: >-
    Armenia keeps the engine-free populace-US pool-reweight demonstrator intact
    and adds a separately selected native ILCS 2024 household/member spine. The
    native stage authenticates caller-supplied local workbooks and preserves
    their monthly AMD basis; it does not authorize redistribution, calibration,
    release, or a rules engine.
stages:
- stage: load_populace_us_support_pool
  survey: Populace US support pool (US donor support records)
  source: https://huggingface.co/datasets/policyengine/populace-us
  grain: person
  artifacts:
  - kind: public_microdata
    format: hdf5
    vintage: HARVEST_REQUIRED
    locator: policyengine/populace-us
    source: https://huggingface.co/datasets/policyengine/populace-us
    repository:
      provider: huggingface
      owner: policyengine
      name_parts:
      - populace-us
      repo_type: dataset
    integrity_note: >-
      Execution must receive an exact certified revision, filename, SHA-256,
      and byte size. Those artifact coordinates are a harvest item; no
      latest-revision fallback is allowed.
  operations:
  - kind: read_tables
    tables:
    - person
    - household
    weight: household_weight
  - kind: derive
    scope: >-
      Direct-column identities and deterministic prepared indicators only. The
      authenticated pool inventory must prove every declared output or
      compilation refuses it; no engine-owned or simulated Armenian measure
      may be created.
  outputs:
  - person_id
  - household_id
  - person_household_id
  - household_weight
  - support_stratum
  - donor_country_code
  - age
  - sex
  - people
  - households
  - household_size
  - household_consumption
  - household_consumption_band_indicator
  - is_employed
  - is_employee
  - is_payroll_employee
  - receives_pension
  - receives_family_benefit
  nonnegative_outputs:
  - household_weight
  - people
  - households
  - household_size
  - household_consumption
  - household_consumption_band_indicator
  - is_employed
  - is_employee
  - is_payroll_employee
  - receives_pension
  - receives_family_benefit
  notes: >-
    This posture is derived from the New Zealand epic #343 plan because NZ has
    no committed country package. The stage preserves and publishes US
    support-stratum provenance. HARVEST_REQUIRED is an explicit refusal marker,
    not a claimed donor vintage: the exact artifact vintage, column inventory,
    indicator recipes, target-profile bands, and authenticated artifact
    coordinates must land before any runtime binding.
- stage: assign_am_marz
  survey: ArmStat 2022 census population margins
  source: https://statbank.armstat.am
  grain: person
  artifacts:
  - role: marz_assignment_counts
    kind: public_aggregated_counts
    resource: ledger-am:armstat_population_by_age_sex_marz
    format: ledger_fact_package
  operations:
  - kind: sample_categorical_from_count_table
    output: marz_code
    count_resource: ledger-am:armstat_population_by_age_sex_marz
    cell_columns:
    - age
    - sex
    assignment_grain: household
    collapse_to: household
    collapse_method: identity_keyed_member_profile
    seed: 0
  outputs:
  - marz_code
  nonnegative_outputs: []
  notes: >-
    The assignment preserves household co-location and covers the 2022-census
    roster of 10 marzes plus Yerevan (11 top-level units). Marz is generated
    from public Armenian margins on US donor support records; it is not
    observed Armenian microdata. The exact Statbank table and complete code
    roster are Chronicle harvest items.
- stage: ingest_am_ilcs_2024
  survey: ArmStat Integrated Living Conditions Survey 2024 household and present-member files
  source: https://armstat.am/en/?nid=205
  grain: person_household
  artifacts:
  - role: ilcs_table
    table: household
    kind: public_microdata
    format: xlsx
    vintage: '2024'
    locator: households_2024.xlsx
    sheet: Household - 2024
    source: https://armstat.am/file/doc/99565003.xlsx
    sha256: 48527e2de376e7ef88dc04ac9fe2de2fdc1728d34ce2d753ce165ab5c496590e
    size_bytes: 2186167
    expected_rows: 5184
    runtime_sha256_required: true
    integrity_note: >-
      The workbook is publicly downloadable, but the raw file remains
      caller-supplied and local-only. Exact ArmStat redistribution terms remain
      a release blocker.
  - role: ilcs_table
    table: member
    kind: public_microdata
    format: xlsx
    vintage: '2024'
    locator: members_2024.xlsx
    sheet: Sheet1
    source: https://armstat.am/file/doc/99565008.xlsx
    sha256: 6d52cc9867147043decbc8539dd40ac428468fba0caed60176b28bd7bc1a24f5
    size_bytes: 8613335
    expected_rows: 17744
    runtime_sha256_required: true
    integrity_note: >-
      The present-member workbook is joined totally to the household workbook.
      It remains caller-supplied and local-only pending exact licence review.
  operations:
  - kind: read_tables
    format: xlsx
    lowercase_columns: false
    numeric_errors: raise
    runtime_sha256_required: true
  - kind: replace_sentinels
    scope: household and member workbooks
    sentinels:
    - -999999999
  - kind: join
    left: member
    right: household
    keys:
    - interview__key
    linkage: ilcs_interview_key
    validation: many_to_one_total_on_both_sides
    notes: >-
      Every present-member row resolves to one household and every household has
      at least one present member; memnal must equal the joined member count.
  - kind: declare_income_reference_offset
    years: 0
    notes: >-
      The workbook Labels sheet declares income and expenditure fields as
      household amounts per survey month in dram. Runtime preserves monthly AMD
      and applies no annualization.
  - kind: map_columns
    mapping:
      interview__key: ilcs_interview_key
      mem_001__id: source_person_sequence
      mem_05: age
      mem_02: sex
      mem_03: relationship_to_household_head
      ed_03: education_level
      emplj: is_employed
      unemployed: is_unemployed
      activ: is_economically_active
      emp_05: employment_status
      emp_04: industry_code
      emp_10: usual_weekly_hours
      date_q: survey_month
      hh_02: marz_code_observed
      settlement: settlement_type
      members: household_members_reported
      memnal: present_household_size
      expend: household_expenditure_monthly
      monincome: monetary_income_monthly
      totincome: total_income_monthly
      nonmoninc: non_monetary_income_monthly
      'y1_3amd.1.00': employment_income_monthly
      'y1_3amd.2.00': self_employment_income_monthly
      'y1_3amd.4.00': pension_income_reported_monthly
      'y1_3amd.6.00': family_benefit_reported_monthly
      'y1_3amd.8.00': childbirth_grant_reported_monthly
      'y1_3amd.9.00': child_under_two_benefit_reported_monthly
      'y1_3amd.10.00': other_child_benefit_reported_monthly
      'y1_3amd.12.00': other_benefit_reported_monthly
      'y1_3amd.17.00': property_and_investment_income_monthly
      'y1_3amd.18.00': private_transfer_income_domestic_monthly
      'y1_3amd.19.00': private_transfer_income_abroad_monthly
      aec_r: adult_equivalent_consumption_monthly
      poverty: poverty_status_survey
    notes: >-
      Identifiers are content-determined dense ids. Monthly AMD receipts remain
      observed inputs or holdouts; no tax, contribution, or statutory benefit
      output is simulated here.
  - kind: derive
    scope: >-
      Derive stable dense household/person ids, membership, and is_employee
      directly from authenticated source keys and emp_05 codes. No policy
      formula or synthetic allocation is applied.
  outputs:
  - person_id
  - person_household_id
  - age
  - sex
  - relationship_to_household_head
  - education_level
  - is_employed
  - is_employee
  - is_unemployed
  - is_economically_active
  - employment_status
  - industry_code
  - usual_weekly_hours
  - household_id
  - ilcs_interview_key
  - survey_month
  - marz_code_observed
  - settlement_type
  - household_members_reported
  - present_household_size
  - household_expenditure_monthly
  - monetary_income_monthly
  - total_income_monthly
  - non_monetary_income_monthly
  - employment_income_monthly
  - self_employment_income_monthly
  - pension_income_reported_monthly
  - family_benefit_reported_monthly
  - childbirth_grant_reported_monthly
  - child_under_two_benefit_reported_monthly
  - other_child_benefit_reported_monthly
  - other_benefit_reported_monthly
  - property_and_investment_income_monthly
  - private_transfer_income_domestic_monthly
  - private_transfer_income_abroad_monthly
  - adult_equivalent_consumption_monthly
  - poverty_status_survey
  nonnegative_outputs:
  - age
  - is_employed
  - is_employee
  - is_unemployed
  - is_economically_active
  - usual_weekly_hours
  - household_members_reported
  - present_household_size
  - household_expenditure_monthly
  - monetary_income_monthly
  - total_income_monthly
  - non_monetary_income_monthly
  - employment_income_monthly
  - self_employment_income_monthly
  - pension_income_reported_monthly
  - family_benefit_reported_monthly
  - childbirth_grant_reported_monthly
  - child_under_two_benefit_reported_monthly
  - other_child_benefit_reported_monthly
  - other_benefit_reported_monthly
  - property_and_investment_income_monthly
  - private_transfer_income_domestic_monthly
  - private_transfer_income_abroad_monthly
  - adult_equivalent_consumption_monthly
  notes: >-
    This separately selected native source channel builds a local design-weight
    Frame with 5,184 households and 17,744 present members. It neither replaces
    the donor diagnostic nor enables calibration, release, publication, or a
    policy engine.
