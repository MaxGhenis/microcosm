# Microcosm US and UK roadmap, 2026-09 to 2027-08, as a plangraph plan.
#
# Sources, read 2026-09-24 and brought up to date 2026-09-29: the weekly scoreboard #1013,
# epic #956, the 09-24 #microcosm meeting thread, and the issues and PRs each item names.
# The scoreboard's probabilities are not plan data and nothing here uses them.
#
# Month grain. Index 0 is 2026-09. A successor starts the month after its predecessor's
# last month, so two steps that both land in October read here as October, then November.
# Work finished in September stays in the plan as a September item, so what followed it
# still names it as the cause of its start.
#
# Starts. `earliest` is the month a source declared or committed (a #1013 commitment due
# 10-01 counts as September), else 2026-09: the work could start now and only its
# predecessors hold it. So every start names what bound it, and W104 flags an item that
# starts well after a month someone declared.
#
# What is sourced and what is assumed. plangraph carries a basis (D derived, A assumed,
# M measured) on demands and costs but not on durations or dates, so each item's comment
# says which of its start, duration and deadline a source states. Anything a comment does
# not attribute is assumed. Every demand is basis A: an assumed share of one person's whole
# time, where capacity 1 is one full-time person. Work outside microcosm is not in the plan,
# so the overloads the harness reports are a floor.
#
# Deadlines. plangraph has no deadline field, so a date an item must meet (a register
# expiry, the County Files MVP window, the waiver lapse) is in its comment and nothing
# checks it.
#
# Uncosted. plangraph requires a loaded cost on every seat; each carries 0 with basis A,
# which means this plan models no cost, not that anyone is free. There are no revenue
# streams or funding lines, so the report's money rows print zero.
#
# Owners. Where nobody is named yet (County Files #922, whose owner decision d150 was parked
# on 09-25; #940; the UK consumer switch; the waiver follow-up), the item sits with Max, who
# owes the naming, and its comment says so.
#
# The Route A flip. d098 (ruled 09-25) publishes Route A tag-only and leaves the flip to a
# later call with two branches: flip once #1013's proposed condition holds, or wait for
# #578's exact-k gate as docs/us-release-build-rule.md is written. plangraph scenarios can
# drop items but cannot rewire an edge, so the plan carries one flip item per branch and
# each scenario drops the other.
#
# Needs plangraph main from 2026-09-28 (TheAxiomFoundation/plangraph #1), which has seat
# `unlevelled` and scenario `dropItems`. Run: bun <plangraph>/src/cli.ts check docs/roadmap.yaml
name: Microcosm US and UK roadmap
calendar:
  startYear: 2026
  startMonth: 9
  horizonMonths: 12
  fundingYearStartMonth: 0
# Booking priority when leveling. release: the certified defaults and what gates them.
# commitment: external dates. platform: CI, dashboard, data follow-ups. graph: the
# graph-native line, whose full-source compute waits on funding (d112, parked 09-23).
circles: [release, commitment, platform, graph]
escalation: {rate: 0, basis: A}

seats:
  # Max leads; leveling never waits for room on him, and his overload is reported instead.
  - {id: max, title: Max, loadedAnnual: 0, costBasis: A, hireMonths: [0], capacityFte: 1, fallback: null, unlevelled: true}
  - {id: maria, title: María, loadedAnnual: 0, costBasis: A, hireMonths: [0], capacityFte: 1, fallback: null}
  - {id: vahid, title: Vahid, loadedAnnual: 0, costBasis: A, hireMonths: [0], capacityFte: 1, fallback: null}
  - {id: anthony, title: Anthony, loadedAnnual: 0, costBasis: A, hireMonths: [0], capacityFte: 1, fallback: null}
  - {id: ziming, title: Ziming, loadedAnnual: 0, costBasis: A, hireMonths: [0], capacityFte: 1, fallback: null}
  - {id: david, title: David, loadedAnnual: 0, costBasis: A, hireMonths: [0], capacityFte: 1, fallback: null}
  - {id: pavel, title: Pavel, loadedAnnual: 0, costBasis: A, hireMonths: [0], capacityFte: 1, fallback: null}

