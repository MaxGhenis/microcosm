schema_version: 1
title: US stacked pool - imputation lineage spec
provenance: v1 extracted from code on main (b420d4ed) 2026-08-15; from here the YAML is the source of
  truth and code must conform (tests/test_imputation_lineage_spec.py)
models:
  regime_gated_qrf:
    id: regime_gated_qrf
    implementation: microcosm.fit.qrf.RegimeGatedQRF
    backend: quantile_forest.RandomForestQuantileRegressor
    n_estimators: 100
    max_samples_leaf: null
    zero_atol: 1.0e-06
    weighting: weighted bootstrap of training rows (design weights) before each forest; gate weighted
      directly via sample_weight
    regime_detection: unweighted sign support -> {three_sign, zero_inflated_positive, zero_inflated_negative,
      sign_only, positive_only, negative_only, degenerate_zero}
    gate:
      model: sklearn.ensemble.HistGradientBoostingClassifier
      draw: categorical draw against predict_proba with the seeded RNG
    magnitude:
      model: one QRF per nonzero sign class
      draw: q ~ Uniform(0,1) per row; forest queried at q
    chaining: sequential; each target conditions on predictors + previously drawn targets in the family
    boolean_targets_note: 'a 0/1 target detects as zero_inflated_positive: the whole model is the gate
      classifier + one draw; the magnitude forest is degenerate on 1'
    post_draw_calibration: null
predictor_sets:
  acs_person_transfer:
    required:
    - age
    - is_female
    - state_fips
    optional:
    - employment_income
    - self_employment_income
    - social_security_income
    - retirement_income
    - interest_dividend_rental_income
    - is_household_head
    - tenure_code
    note: ONE shared tuple for every ACS gap-fill family, money and boolean alike; missingness handled
      by availability-pattern partition (one fit per observed-predictor pattern)
  acs_group_transfer:
    required:
    - person_count
    - age_sum
    - female_count
    - state_fips
    optional:
    - group_employment_income
    - group_self_employment_income
    - group_social_security_income
    - group_retirement_income
    - group_interest_dividend_rental_income
    - group_is_household_head
    - group_tenure_code
  puf_tax_detail:
    required:
    - puf_predictor_filing_status_code
    - puf_predictor_tax_unit_person_count
    - puf_predictor_employment_income
    - puf_predictor_self_employment_income
    - puf_predictor_taxable_interest_income
    - puf_predictor_dividend_income
    - puf_predictor_short_term_capital_gains
    - puf_predictor_long_term_capital_gains
    optional: []
    note: tax-return-shaped; no age, state, marital status, or children
