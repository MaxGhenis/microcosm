[project]
name = "microcosm-build"
version = "0.1.0"
description = "The build end of the microcosm stack: typed stage plans with declarative donor graphs, and the dataset acceptance gates (parity, support, aggregate-vs-admin, per-family fit, rotated holdout) every release must pass"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "PolicyEngine" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2",
    "scipy>=1.13",
    "huggingface-hub>=0.20",
    "microcosm-frame>=0.1,<0.2",
    "microcosm-fit>=0.1,<0.2",
    "microcosm-calibrate>=0.1,<0.2",
    # Parquet is the artifact format for the us_trade margin and entry
    # tables; pandas>=3 pulls pyarrow anyway, but the dependency is real.
    "pyarrow>=15",
    # YAML backs the generated country bundles and the retained migration
    # extractor; strict loading itself lives in microcosm.build.spec_engine.
    "pyyaml>=6",
    "jsonschema>=4.23,<5",
    "referencing>=0.35,<1",
]

[project.optional-dependencies]
# The AM extra is the local-only native ILCS ingest surface. It parses the
# two pinned XLSX workbooks and writes a staging H5; no country policy engine
# is installed or imported.
am = ["openpyxl>=3.1", "h5py>=3", "tables>=3"]
# The US extra adds the rules engine for formula-owned export checks. Source
# content is declared in packaged manifests and interpreted by shared Microcosm
# runtimes; country source loaders must not depend on incumbent data packages.
us = [
    "policyengine-us>=1.745.0,<2",
    "microcosm-data>=0.1,<0.2",
    "h5py>=3",
    "microunit>=0.1.0",
    "tables>=3",
]
# The UK extra adds the rules engine for local metric generation from a
# Microcosm UK H5. Target tables remain explicit inputs, and the base package
# still does not import policyengine-uk at import time.
uk = ["policyengine-uk>=2.92", "h5py>=3", "tables>=3"]

[project.scripts]
microcosm-export-us-l0-refit-h5 = "microcosm.build.us_runtime.l0_refit_export:main"

[project.urls]
Homepage = "https://microcosm.institute"
Repository = "https://github.com/PolicyEngine/microcosm"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The package is literally named microcosm.build; pathspec's directory-negation
# semantics differ from git's, so the repo's `build/` ignore pattern would
# silently empty the wheel. Inclusion is explicit below — skip VCS ignores.
ignore-vcs = true
# Never package unreviewed Armenian survey inputs or derivatives, even if a
# local file is accidentally placed under src/.  This is a positive-inventory
# rights boundary independent of .gitignore because ignore-vcs=true is required
# for the namespace package. Other country runtimes legitimately ship reviewed
# tabular resources, so the exclusion is deliberately country-scoped.
exclude = [
    # Armenia is a positive resource inventory: exclude the entire country
    # data directory, then force-include only the reviewed spec files below.
    # A payload renamed to JSON/BIN therefore cannot enter either archive.
    "src/microcosm/build/am/**",
    "src/microcosm/build/am_runtime/**",
]

[tool.hatch.build.force-include]
"src/microcosm/build/am/country_package.json" = "src/microcosm/build/am/country_package.json"
"src/microcosm/build/am/gates.json" = "src/microcosm/build/am/gates.json"
"src/microcosm/build/am/geography_spine.json" = "src/microcosm/build/am/geography_spine.json"
"src/microcosm/build/am/release_contract.json" = "src/microcosm/build/am/release_contract.json"
"src/microcosm/build/am/source_stages.json" = "src/microcosm/build/am/source_stages.json"
"src/microcosm/build/am/spec/bundle.yaml" = "src/microcosm/build/am/spec/bundle.yaml"
"src/microcosm/build/am/spec/catalogs.yaml" = "src/microcosm/build/am/spec/catalogs.yaml"
"src/microcosm/build/am/spec/geography.yaml" = "src/microcosm/build/am/spec/geography.yaml"
"src/microcosm/build/am/spec/sources.yaml" = "src/microcosm/build/am/spec/sources.yaml"
"src/microcosm/build/am/spec/spine.yaml" = "src/microcosm/build/am/spec/spine.yaml"
"src/microcosm/build/am/spec/vintages.yaml" = "src/microcosm/build/am/spec/vintages.yaml"
"src/microcosm/build/am/target_references.json" = "src/microcosm/build/am/target_references.json"
"src/microcosm/build/am_runtime/__init__.py" = "src/microcosm/build/am_runtime/__init__.py"
"src/microcosm/build/am_runtime/ilcs_spine.py" = "src/microcosm/build/am_runtime/ilcs_spine.py"
"src/microcosm/build/am_runtime/national_frame.py" = "src/microcosm/build/am_runtime/national_frame.py"

[tool.hatch.build.targets.wheel]
packages = ["src/microcosm"]

[tool.uv.sources]
microcosm-frame = { workspace = true }
microcosm-fit = { workspace = true }
microcosm-calibrate = { workspace = true }
microcosm-data = { workspace = true }
