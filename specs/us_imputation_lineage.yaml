# are recorded separately so a later mechanism is never mistaken for artifact
# production.
take_up_draws:
- entity: spm_unit
  column: takes_up_snap_if_eligible
  artifact_assignment: missing rows filled with the installed-engine constant true default; nonnull inputs preserved
  f025_observation: 868956 true, 0 false; every row was defaulted
  contract:
    treatment: out_of_scope
    engine_default: true
    rate_status: sourced_administrative
    rate_value: 0.82
  producer_stage: seed_multispine_pool_inputs
  probability_source: none at artifact stage; downstream uses the contract's 0.82 FNS national precursor before deriving state fill rates from FNS counts and eligible mass
  conditioning: per SPM unit over the whole artifact, with no eligibility or receipt interaction at this stage; the final SNAP amount multiplies the flag
  determinism: deterministic constant-or-preserved assignment; downstream uses a configured-seed stable source-identity hash so clones agree
  calibration_status: no artifact-stage calibration; downstream greedily targets anchored state counts on the reachable eligible domain within whole-unit weight tolerance
  downstream_replacement: >-
    The fiscal source stage anchors ASEC SPM_SNAPSUB reporters, uses stable
    source-identity draws for a national 0.82 precursor, then overwrites by
    state through anchored count calibration against FNS eligible-unit targets.
